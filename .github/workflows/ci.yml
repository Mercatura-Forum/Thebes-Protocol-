name: examples-compile

# Every example must compile — Motoko with moc, Rust to wasm32 — so nothing rots.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  motoko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: moc --check every example (with mo:core via mops)
        run: |
          set -e
          npm i -g ic-mops
          mops toolchain init          # installs moc + wasmtime
          mops install                 # fetch mo:core
          # Resolve the moc binary robustly. `mops toolchain bin moc` can print
          # an advisory line as well as the path, so extract the absolute path;
          # fall back to mops' DFX_MOC_PATH wrapper, then PATH.
          MOC=""
          for cand in \
            "$(mops toolchain bin moc 2>/dev/null | grep -Eo '/[^ ]*moc' | head -1)" \
            "$DFX_MOC_PATH" moc-wrapper moc; do
            if [ -n "$cand" ] && command -v "$cand" >/dev/null 2>&1; then MOC="$cand"; break; fi
          done
          [ -n "$MOC" ] || { echo "could not locate moc"; exit 1; }
          echo "using moc: $MOC"; "$MOC" --version
          SRCS="$(mops sources)"
          fail=0
          for f in $(find examples -path '*/motoko/*.mo'); do
            echo "== moc --check $f =="
            "$MOC" $SRCS --check "$f" || fail=1
          done
          exit $fail

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: cargo build every Rust example to wasm32
        run: |
          set -e
          for d in $(find examples -name Cargo.toml -path '*/rust/*' -printf '%h\n'); do
            echo "== cargo build $d =="
            (cd "$d" && cargo build --target wasm32-unknown-unknown --release)
          done
